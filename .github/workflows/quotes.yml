name: Update end-of-day quotes

on:
  schedule:
    # 22:30 UTC Mon–Fri ≈ 4:30 PM CST / 5:30 PM CDT, after CME livestock & grain closes
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quotes
        run: python scripts/fetch_quotes.py
      - name: Commit if changed
        run: |
          git config user.name "herdledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update end-of-day quotes $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
