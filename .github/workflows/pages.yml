name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update end-of-day quotes"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run calculation tests
        run: node tests/calc.test.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html app.html sw.js manifest.webmanifest css js img data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
